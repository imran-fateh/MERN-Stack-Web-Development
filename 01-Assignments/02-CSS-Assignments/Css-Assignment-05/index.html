<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Order Table</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Order ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td data-label="Date">2026-07-10</td>
                    <td data-label="Order ID">#1001</td>
                    <td data-label="Name">iPhone X</td>
                    <td data-label="Price">$800</td>
                    <td data-label="Quantity">1</td>
                    <td data-label="Total">$800</td>
                </tr>

                <tr>
                    <td data-label="Date">2026-07-11</td>
                    <td data-label="Order ID">#1002</td>
                    <td data-label="Name">Samsung S8</td>
                    <td data-label="Price">$650</td>
                    <td data-label="Quantity">1</td>
                    <td data-label="Total">$650</td>
                </tr>

                <tr>
                    <td data-label="Date">2026-07-12</td>
                    <td data-label="Order ID">#1003</td>
                    <td data-label="Name">USB Cable</td>
                    <td data-label="Price">$15</td>
                    <td data-label="Quantity">2</td>
                    <td data-label="Total">$30</td>
                </tr>

                <tr>
                    <td data-label="Date">2026-07-13</td>
                    <td data-label="Order ID">#1004</td>
                    <td data-label="Name">MacBook Pro</td>
                    <td data-label="Price">$1800</td>
                    <td data-label="Quantity">1</td>
                    <td data-label="Total">$1800</td>
                </tr>

                <tr>
                    <td data-label="Date">2026-07-14</td>
                    <td data-label="Order ID">#1005</td>
                    <td data-label="Name">Smartwatch</td>
                    <td data-label="Price">$250</td>
                    <td data-label="Quantity">2</td>
                    <td data-label="Total">$500</td>
                </tr>

                <tr>
                    <td data-label="Date">2026-07-15</td>
                    <td data-label="Order ID">#1006</td>
                    <td data-label="Name">AirPods</td>
                    <td data-label="Price">$180</td>
                    <td data-label="Quantity">1</td>
                    <td data-label="Total">$180</td>
                </tr>

            </tbody>

        </table>

    </div>

</body>

</html>
