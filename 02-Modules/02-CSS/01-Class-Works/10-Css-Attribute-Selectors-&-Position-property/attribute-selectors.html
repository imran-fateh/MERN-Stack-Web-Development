<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Attribute Selectors</title>
    <link rel="stylesheet" href="./attribute-selectors.css">
</head>

<body>

    <!-- Main Heading -->
    <h1>CSS Day 10 - Attribute Selectors</h1>

    <p class="content">
        Today we are learning CSS Attribute Selectors.
        This page demonstrates how different HTML attributes can be
        targeted and styled using CSS selectors.
    </p>

    <!-- Attribute Selector -->

    <form>

        <h2>Registeration Form</h2>

        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="username" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="userpassword" required>
        </div>

        <div class="form-group">
            <label>Gender</label>

            <input type="radio" id="male" name="gender">
            <label for="male" class="inline">Male</label>

            <input type="radio" id="female" name="gender">
            <label for="female" class="inline">Female</label>
        </div>

        <div class="form-group">
            <input type="submit" value="Register">
        </div>

    </form>

    <div class="buttom-content">
        <h3>Other Attribute Selector Examples</h3>

        <p class="important notice">
            This is an important message.
        </p>

        <p lang="en-US">
            English Paragraph
        </p>

    </div>

</body>

</html>
